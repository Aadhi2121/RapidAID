version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: civicai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: civicai_password
      POSTGRES_DB: civicai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicai_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:civicai_password@postgres:5432/civicai_db
      JWT_SECRET: civicai-super-secret-key-production-ready-2026
      AI_MODE: real
      MODEL_PATH: ./ml_models
      LLM_API_KEY: ""
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
